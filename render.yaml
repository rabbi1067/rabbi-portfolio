# This creates a backend service with a paid persistent disk. Review the plan/cost in Render before applying.
services:
  - type: web
    name: rabbi-portfolio-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/public/health
    disk:
      name: portfolio-content
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATA_DIR
        value: /var/data
  - type: web
    name: rabbi-portfolio-frontend
    runtime: static
    rootDir: frontend
    buildCommand: pip install -r requirements.txt && python scripts/build.py
    staticPublishPath: dist
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
    headers:
      - path: /frontend-config.js
        name: Cache-Control
        value: no-store
