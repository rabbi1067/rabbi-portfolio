server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=false
portfolio.source=${PORTFOLIO_SOURCE:../frontend}
portfolio.data=${DATA_DIR:./data}
portfolio.python=${PYTHON_COMMAND:python}
portfolio.origins=${ALLOWED_ORIGINS:http://localhost:8000,http://127.0.0.1:8000,http://localhost:8080,http://127.0.0.1:8080}
portfolio.public-url=${FRONTEND_URL:http://localhost:8080}
portfolio.admin-email=${ADMIN_EMAIL:}
portfolio.admin-password=${ADMIN_PASSWORD:}
portfolio.admin-password-hash=${ADMIN_PASSWORD_HASH:}
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
